# Docker Compose for 300 Club backend (Django + PostgreSQL)
#
# nginx runs on the HOST (not in Docker) so it can serve both the Angular
# frontend files (deployed via CI rsync) and proxy to this stack.
#
# Usage on the Lightsail instance:
#   cd /opt/leaderboard/backend
#   docker compose up -d
#
# Environment variables are loaded from /opt/leaderboard/.env.production
# which must exist on the server (never committed to git).

services:

  # -------------------------------------------------------------------------
  # PostgreSQL
  # -------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME}
      POSTGRES_USER:     ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # NOT exposed to the host — only reachable by the web container
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------------------
  # Django / Gunicorn
  # -------------------------------------------------------------------------
  web:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_ENV:            production
      DJANGO_SECRET_KEY:     ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG:          "False"
      DJANGO_ALLOWED_HOSTS:  ${DJANGO_ALLOWED_HOSTS}
      DB_NAME:               ${DB_NAME}
      DB_USER:               ${DB_USER}
      DB_PASSWORD:           ${DB_PASSWORD}
      DB_HOST:               db      # Docker service name, not localhost
      DB_PORT:               "5432"
      CORS_ALLOWED_ORIGINS:  ${CORS_ALLOWED_ORIGINS}
      CSRF_TRUSTED_ORIGINS:  ${CSRF_TRUSTED_ORIGINS}
    ports:
      # Bind to localhost only — nginx on the host proxies to this
      - "127.0.0.1:8000:8000"
    volumes:
      # Bind mount so nginx on the HOST can serve Django's static files directly.
      # The directory must exist on the host: mkdir -p /opt/leaderboard/staticfiles
      - /opt/leaderboard/staticfiles:/app/staticfiles
    command: sh -c "python manage.py collectstatic --noinput && python manage.py migrate --noinput && gunicorn --bind 0.0.0.0:8000 --workers 2 --timeout 60 --access-logfile - --error-logfile - backend.wsgi:application"

volumes:
  postgres_data:
    driver: local
