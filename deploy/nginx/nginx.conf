# nginx configuration for 300clubleaderboard.com
#
# Architecture:
#   - nginx listens on 80 (443 via certbot/TLS — uncomment the TLS blocks below)
#   - /api/*    → reverse-proxied to Django/Gunicorn container (port 8000, localhost)
#   - /admin/*  → same Django container (Django admin)
#   - /static/* → Django collected static files on disk
#   - /*        → Angular SPA static files at /opt/leaderboard/frontend/
#                 with try_files fallback to index.html for client-side routing
#
# The Angular SSR server.mjs is NOT deployed. Static build only.

worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    server_tokens   off;   # Don't advertise nginx version

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;

    # -----------------------------------------------------------------------
    # Rate limiting zones
    # -----------------------------------------------------------------------
    # 10 requests/second per IP for API endpoints — generous for a small app
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    # Tighter limit for admin
    limit_req_zone $binary_remote_addr zone=admin_limit:10m rate=3r/s;

    # -----------------------------------------------------------------------
    # Upstream: Django/Gunicorn (runs in Docker, exposed on host port 8000)
    # -----------------------------------------------------------------------
    upstream django {
        server 127.0.0.1:8000;
        keepalive 16;
    }

    # -----------------------------------------------------------------------
    # HTTP → HTTPS redirect
    # Certbot manages this automatically. Listed here for reference.
    # -----------------------------------------------------------------------
    server {
        listen 80;
        server_name 300clubleaderboard.com www.300clubleaderboard.com
                    staging.300clubleaderboard.com;
        return 301 https://$host$request_uri;
    }

    # -----------------------------------------------------------------------
    # Main server block — HTTPS (TLS via Let's Encrypt / Certbot)
    # -----------------------------------------------------------------------
    server {
        listen 443 ssl;
        server_name 300clubleaderboard.com www.300clubleaderboard.com;

        ssl_certificate     /etc/letsencrypt/live/300clubleaderboard.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/300clubleaderboard.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options        "DENY"    always;
        add_header X-XSS-Protection       "1; mode=block" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        # Maximum request body (prevent large payload abuse)
        client_max_body_size 1m;

        # ---------------------------------------------------------------
        # Django admin — strict rate limit
        # ---------------------------------------------------------------
        location /admin/ {
            limit_req zone=admin_limit burst=5 nodelay;
            proxy_pass         http://django;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # ---------------------------------------------------------------
        # Django REST API
        #
        # The Angular interceptor sends requests to /api/leaderboard/...
        # nginx strips the /api prefix before forwarding to Django.
        # ---------------------------------------------------------------
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            # Strip /api prefix — Django URLs start with /leaderboard/ or /admin/
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass         http://django;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # ---------------------------------------------------------------
        # Django static files (collected by manage.py collectstatic)
        # ---------------------------------------------------------------
        location /static/ {
            alias /opt/leaderboard/staticfiles/;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # ---------------------------------------------------------------
        # Angular SPA — served from compiled dist/browser directory
        #
        # The Angular app is built in CI and rsync'd to the server.
        # All unknown paths fall back to index.html for client-side routing.
        # ---------------------------------------------------------------
        location / {
            root /opt/leaderboard/frontend;
            index index.html;

            # Cache hashed assets forever; index.html must revalidate
            location ~* \.(js|css|woff2?|png|jpg|ico|svg|webmanifest)$ {
                root /opt/leaderboard/frontend;
                expires 1y;
                add_header Cache-Control "public, immutable";
                try_files $uri =404;
            }

            # SPA fallback — must come last
            try_files $uri $uri/ /index.html;
        }
    }

    # -----------------------------------------------------------------------
    # Staging server block (same box, different domain)
    # -----------------------------------------------------------------------
    server {
        listen 80;
        server_name staging.300clubleaderboard.com;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options        "DENY"    always;
        client_max_body_size 1m;

        location /admin/ {
            limit_req zone=admin_limit burst=5 nodelay;
            proxy_pass         http://django;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass         http://django;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location /static/ {
            alias /opt/leaderboard/staticfiles/;
        }

        location / {
            root /opt/leaderboard/frontend-staging;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
